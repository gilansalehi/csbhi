<script type="module" data-module="@csbhi/home/publication-list">
    import { getCollection } from 'project/project-catalog.js';

    export default ({ wrapper }) => getCollection(wrapper.dataset.collection);
</script>

<section class="publication-list" $aria-labelledby="headingId">
    <h2 $id="headingId" $text="title"></h2>
    <template *if="hasIntro">
        <p $unsafeHTML="introHtml"></p>
    </template>
    <details open>
        <summary $text="summary"></summary>
        <ol>
            <template *list="documents">
                <li>
                    <div $text="./label"></div>
                    <div>
                        <h3><a $href="./href" $text="./title"></a></h3>
                        <p $text="./summary"></p>
                        <p>
                            <span $text="./meta"></span>
                            <template *if="./startHere">
                                <span> · <span class="start-here">Start here</span></span>
                            </template>
                            <template *if="./prerequisite">
                                <span> · <span class="prq-label">PRQ:</span> <a $href="./prerequisite/href" $text="./prerequisite/label"></a></span>
                            </template>
                        </p>
                    </div>
                </li>
            </template>
        </ol>
    </details>

    <template *if="showReviewerGuide">
        <fieldset class="legend-box review-packet__guide">
            <legend>Reviewer Guide</legend>
            <p>The packet does not ask reviewers to accept speculative proposals. The questions:</p>
            <ul>
                <li>Does RI I follow from its stated metric and matter assumptions?</li>
                <li>Does the involution proof establish exactly what it claims?</li>
                <li>Are the Weyl/density identity, shear-free obstruction, and transverse stress correct?</li>
                <li>Does \(g_\dagger(z)/g_\dagger(0)=H(z)/H_0\) follow from the correspondence without assuming it, and can observers distinguish it from a constant scale and from feedback-driven evolution?</li>
                <li>What collapse or junction data would complete the spacetime?</li>
            </ul>
            <p>Not yet peer-reviewed.</p>
        </fieldset>
    </template>
</section>
