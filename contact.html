<script type="module" data-module="@csbhi/contact">
    const email = 'gilansalehi@gmail.com';
    const github = 'https://www.github.com/gilansalehi/csbhi';
    const personalSite = 'https://www.gilansalehi.com/';

    export default () => ({
        emailHtml: email.split('').join('&#8203;'),
        github,
        personalSite,
        copyEmail() {
            navigator.clipboard?.writeText(email);
        },
    });
</script>

<section id="contact">
    <header class="contact-card__header">
        <p class="contact-card__eyebrow">Questions, criticism, collaboration</p>
        <h2>Contact Me</h2>
    </header>
    <dl class="contact-card__links">
        <dt>email</dt>
        <dd>
            <button class="link-button email-container"
                type="button"
                title="Copy email address"
                $unsafeHTML="emailHtml"
                @click="copyEmail"></button>
        </dd>
        <dt>github</dt>
        <dd><a class="github-container" $href="github">CSBHI repository ↗</a></dd>
        <dt>website</dt>
        <dd><a $href="personalSite">gilansalehi.com ↗</a></dd>
    </dl>
</section>
