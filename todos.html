<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>V Component Todos</title>
    <script src="./src/js/app.js" type="module"></script>
    <script type="module">
        import { on, set, v } from './src/js/utils.js';

        on('todos:add', event => {
            v.submit(event.detail.source, 'todos:items', { id: v.uid(), done: false });
        });

        on('todos:toggle', event => {
            set('todos:items', v.toggle('id', event.detail.id));
        });
    </script>
    <style>
        li {
            cursor: pointer;
        }

        li[data-done="true"] {
            text-decoration: line-through;
        }
    </style>
</head>

<body>
    <v-component>
        <h1>Todos</h1>

        <form data-emit="todos:add">
            <label>
                New todo
                <input name="title" autocomplete="off" required>
            </label>
            <button type="submit">Add</button>
        </form>

        <ul as="v-list" data-list="todos:items">
            <template>
                <li data-emit="todos:toggle" data-id="item:id" data-done="item:done">
                    <span as="v">item:title</span>
                </li>
            </template>
        </ul>
    </v-component>
</body>

</html>
