<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Notes from Geometric Duality">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <title>Geometric Duality Note</title>

  <script>
    (() => {
      try {
        const savedTheme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia?.('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = savedTheme || (prefersDark ? 'dark' : 'light');
      } catch {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>
  <script type="importmap">
    {
      "imports": {
        "data-wrapper": "https://data-wrapper.org/dist/data-wrapper.js"
      }
    }
  </script>
  <script src="https://data-wrapper.org/dist/data-wrapper.js" type="module"
    data-shim-src="https://ga.jspm.io/npm:es-module-shims@2.8.1/dist/es-module-shims.js"
    data-shim-integrity="sha384-Ojz/JNsyOdkNfGWOlfhDmeq68SXcsoWSABV4yVQn8Wr/YaKJJTrZs5p2Zi39PWuL"></script>

  <link href="src/css/index.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/markdown-it/dist/markdown-it.min.js"></script>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['\\(', '\\)']],
        displayMath: [['\\[', '\\]']],
        processEscapes: true,
        processEnvironments: true
      },
      startup: { typeset: false }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>

<body>
  <a class="skip-link" href="#note-content">Skip to note</a>
  <main>
    <data-wrapper src="layout.html"></data-wrapper>
    <data-wrapper src="note-view.html"></data-wrapper>
  </main>
</body>
</html>
