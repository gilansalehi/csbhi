<section>
    <header id="site-header" class="spread page-meta" aria-label="Page header">
        <span>
            <button class="btn btn-icon btn-text"
                type="button"
                aria-label="Open sidebar" aria-controls="page-sidebar" aria-haspopup="dialog" aria-expanded="false"
                onclick="emit('sidebar:toggle', event)"
            >
                <span class="text-2x" aria-hidden="true">&#9776;</span>
            </button>
        </span>
        <span>Updated <time is="v-time">meta:dcterms.modified</time></span>
    </header>

    <v-component src="./src/js/sidebar.js">
        <dialog is="v-dialog" id="page-sidebar" class="sidebar-dialog" aria-labelledby="page-sidebar-title" data-key="sidebar:open" data-print="omit">
            <header class="spread page-meta">
                <h2 id="page-sidebar-title">Sidebar</h2>
                <form method="dialog">
                    <button class="btn btn-icon" type="submit" aria-label="Close sidebar">
                        <span class="text-2x">&#10005;</span>
                    </button>
                </form>
            </header>

            <details is="v-details" data-key="sidebar:preferences">
                <summary>Preferences</summary>
                <p>
                    <button id="theme-toggle" aria-label="Toggle dark mode" class="btn btn-icon" type="button">☀</button>
                </p>
            </details>

            <v-component data-src="#table-of-contents"></v-component>

            <section class="metadata-panel" data-page-metadata>
                <h2>Metadata</h2>
            </section>
        </dialog>
    </v-component>
</section>
