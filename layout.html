<script type="module" data-module="@csbhi/layout">
    const root = document.documentElement;
    const rawModified = document.querySelector('meta[name="dcterms.modified"]')?.content
        || document.querySelector('meta[name="revised"]')?.content
        || '';

    const formatDate = value => {
        if (!value) return '';
        const date = new Date(`${value}T00:00:00`);
        return Number.isNaN(date.getTime())
            ? value
            : date.toLocaleDateString('en-US', {
                month: 'long',
                day: 'numeric',
                year: 'numeric',
            });
    };

    export default () => {
        let navOpen = false;
        let dark = root.dataset.theme === 'dark';

        return {
            modified: formatDate(rawModified),
            modifiedDateTime: rawModified,
            get navOpen() { return navOpen; },
            get themeIcon() { return dark ? '☀' : '☽'; },
            get themeLabel() { return dark ? 'Switch to light mode' : 'Switch to dark mode'; },
            get themeTitle() { return dark ? 'light' : 'dark'; },
            openNav() { navOpen = true; },
            closeNav() { navOpen = false; },
            toggleTheme() {
                dark = !dark;
                root.dataset.theme = dark ? 'dark' : 'light';
                try {
                    localStorage.setItem('theme', root.dataset.theme);
                } catch {}
            },
        };
    };
</script>

<section>
    <header id="site-header" class="spread page-meta" aria-label="Page header">
        <button class="btn btn-icon btn-text"
            type="button"
            aria-label="Open navigation"
            aria-controls="page-sidebar"
            aria-haspopup="dialog"
            $aria-expanded="navOpen"
            @click="openNav">
            <span class="text-2x" aria-hidden="true">&#9776;</span>
        </button>

        <nav aria-label="Site navigation">
            <a href="index.html">Overview</a>
            <span aria-hidden="true">·</span>
            <a href="gd1.html">GD I</a>
        </nav>

        <template *if="modified">
            <span>Updated <time $text="modified" $datetime="modifiedDateTime"></time></span>
        </template>
    </header>

    <dialog id="page-sidebar"
        class="sidebar-dialog"
        aria-labelledby="page-sidebar-title"
        data-print="omit"
        $open="navOpen"
        @close="closeNav">
        <header class="spread page-meta">
            <h2 id="page-sidebar-title">Navigation</h2>
            <button class="btn btn-icon"
                type="button"
                aria-label="Close navigation"
                @click="closeNav">
                <span class="text-2x" aria-hidden="true">&#10005;</span>
            </button>
        </header>

        <nav aria-label="Site navigation">
            <ol>
                <li><a href="index.html">Project overview</a></li>
                <li><a href="gd1.html">GD I — Geometric Duality: Black Hole Interiors</a></li>
            </ol>
        </nav>

        <details>
            <summary>Preferences</summary>
            <p>
                <button id="theme-toggle"
                    class="btn btn-icon"
                    type="button"
                    $text="themeIcon"
                    $title="themeTitle"
                    $aria-label="themeLabel"
                    @click="toggleTheme"></button>
            </p>
        </details>
    </dialog>
</section>
