<script type="module" data-module="@csbhi/layout">
    import { action, flush } from 'data-wrapper';

    const PROJECT_LINKS = Object.freeze([
        { id: 'origin', name: 'Origin', path: 'index.html' },
        { id: 'introduction', name: 'Introduction', path: 'index.html#introduction' },
        { id: 'formation', name: 'Formation', path: 'formation.html' },
        { id: 'publications', name: 'Publications', path: 'index.html#publications' },
        { id: 'predictions', name: 'Predictions', path: 'index.html#predictions' },
        { id: 'review-packet', name: 'Packet I', path: 'review.html' },
        { id: 'pwch', name: 'Packet II', path: 'penrose.html' },
        { id: 'constants', name: 'Constants', path: 'index.html#constants' },
        { id: 'open-problems', name: 'Open Problems', path: 'index.html#open-problems' },
        { id: 'resources', name: 'Resources', path: 'index.html#resources' },
    ]);

    const root = document.documentElement;
    const rawModified = document.querySelector('meta[name="dcterms.modified"]')?.content
        || document.querySelector('meta[name="revised"]')?.content
        || '';

    const formatDate = value => {
        if (!value) return '';
        const date = new Date(`${value}T00:00:00`);
        return Number.isNaN(date.getTime())
            ? value
            : date.toLocaleDateString('en-US', {
                month: 'long',
                day: 'numeric',
                year: 'numeric',
            });
    };

    const isCurrent = path => {
        const current = new URL(document.location.href);
        const destination = new URL(path, current);
        const normalize = pathname => pathname.replace(/\/index\.html$/, '/');
        if (destination.origin !== current.origin) return false;
        if (normalize(destination.pathname) !== normalize(current.pathname)) return false;
        if (destination.search && destination.search !== current.search) return false;
        return destination.hash ? destination.hash === current.hash : !current.hash;
    };

    const pageLinksFromContents = () => {
        const contents = document.querySelector('#table-of-contents');
        if (!contents) return [];

        return [...contents.querySelectorAll('ol > li > a[href^="#"]')]
            .filter(anchor => (
                !anchor.closest('[hidden]')
                && !anchor.parentElement?.parentElement?.closest('li')
            ))
            .map((anchor, index) => ({
                id: `contents-${index}`,
                name: anchor.textContent.trim(),
                path: anchor.getAttribute('href'),
            }));
    };

    const pageLinksFromHeadings = () => {
        const headings = [...document.querySelectorAll(
            'main article h1, main article h2, .descent-story h1, .descent-story h2',
        )];
        const usedIds = new Set(
            [...document.querySelectorAll('[id]')].map(element => element.id),
        );

        return headings.map((heading, index) => {
            if (!heading.id) {
                const stem = heading.textContent
                    .trim()
                    .toLowerCase()
                    .replace(/[^a-z0-9]+/g, '-')
                    .replace(/^-|-$/g, '') || `section-${index + 1}`;
                let id = stem;
                let suffix = 2;
                while (usedIds.has(id)) id = `${stem}-${suffix++}`;
                heading.id = id;
                usedIds.add(id);
            }

            return {
                id: `heading-${heading.id}`,
                name: heading.textContent.trim(),
                path: `#${heading.id}`,
            };
        });
    };

    const readPageLinks = () => {
        const contentsLinks = pageLinksFromContents();
        return contentsLinks.length ? contentsLinks : pageLinksFromHeadings();
    };

    export default ({ wrapper, cleanup }) => {
        let menuOpen = false;
        let dark = root.dataset.theme === 'dark';
        let pageLinks = readPageLinks();
        let pageLinksSignature = JSON.stringify(pageLinks);
        const decorateLinks = links => links.map(link => {
            const current = isCurrent(link.path);
            return {
                ...link,
                class: current ? 'is-current' : '',
                ariaCurrent: current ? 'page' : 'false',
            };
        });
        const projectLinks = decorateLinks(PROJECT_LINKS);

        const closeMenu = action(() => {
            menuOpen = false;
        });

        const dynamicContent = document.querySelector('main');
        if (dynamicContent) {
            const observer = new MutationObserver(() => {
                const next = readPageLinks();
                const signature = JSON.stringify(next);
                if (signature === pageLinksSignature) return;
                pageLinks = next;
                pageLinksSignature = signature;
                flush();
            });
            observer.observe(dynamicContent, { childList: true, subtree: true });
            cleanup(() => observer.disconnect());
        }

        return {
            projectLinks,
            get pageLinks() { return pageLinks; },
            showThemeControl: wrapper.dataset.themeControl !== 'false',
            modified: formatDate(rawModified),
            modifiedDateTime: rawModified,
            get headerStateClass() { return menuOpen ? 'open' : ''; },
            get menuOpen() { return menuOpen; },
            get menuHidden() { return !menuOpen; },
            get themeMenuLabel() { return dark ? 'Switch to light mode' : 'Switch to dark mode'; },
            get themeMenuText() { return dark ? 'DARK' : 'LIGHT'; },
            toggleMenu: action(() => {
                menuOpen = !menuOpen;
            }),
            closeMenu,
            handleKeyUp(event) {
                if (event.detail.originalEvent.key !== 'Escape' || !menuOpen) return;
                closeMenu();
                queueMicrotask(() => wrapper.querySelector('.project-nav__toggle')?.focus());
            },
            toggleTheme() {
                dark = !dark;
                root.dataset.theme = dark ? 'dark' : 'light';
                try {
                    localStorage.setItem('theme', root.dataset.theme);
                } catch {}
            },
        };
    };
</script>

<header class="project-nav"
    $class="headerStateClass"
    @keyup="handleKeyUp"
    data-print="omit">
    <button class="project-nav__toggle"
        type="button"
        aria-label="Toggle navigation"
        aria-controls="project-navigation"
        $aria-expanded="menuOpen"
        @click="toggleMenu">
        <span class="project-nav__toggle-line" aria-hidden="true"></span>
        <span class="project-nav__toggle-line" aria-hidden="true"></span>
        <span class="project-nav__toggle-line" aria-hidden="true"></span>
    </button>

    <nav id="project-navigation"
        class="project-nav__menu"
        aria-label="Project navigation"
        $aria-hidden="menuHidden">
        <template *if="showThemeControl">
            <div class="project-nav__preferences">
                <button class="project-nav__theme"
                    type="button"
                    $aria-label="themeMenuLabel"
                    $title="themeMenuLabel"
                    $text="themeMenuText"
                    @click="toggleTheme"></button>
            </div>
        </template>

        <p class="project-nav__heading">Project</p>
        <ul class="project-nav__list" role="list">
            <template *list="projectLinks">
                <li>
                    <a class="project-nav__link"
                        $class="./class"
                        $href="./path"
                        $text="./name"
                        $aria-current="./ariaCurrent"
                        @click="closeMenu"></a>
                </li>
            </template>
        </ul>

        <template *if="pageLinks?count">
            <section class="project-nav__section" aria-labelledby="on-this-page-title">
                <h2 class="project-nav__heading" id="on-this-page-title">On this page</h2>
                <ul class="project-nav__list project-nav__list--page" role="list">
                    <template *list="pageLinks">
                        <li>
                            <a class="project-nav__link"
                                $href="./path"
                                $text="./name"
                                @click="closeMenu"></a>
                        </li>
                    </template>
                </ul>
            </section>
        </template>

    </nav>

    <button class="project-nav__backdrop"
        type="button"
        aria-label="Close navigation"
        $aria-hidden="menuHidden"
        tabindex="-1"
        @click="closeMenu"></button>
</header>

<template *if="modified">
    <p class="project-updated page-meta">
        Updated <time $text="modified" $datetime="modifiedDateTime"></time>
    </p>
</template>
